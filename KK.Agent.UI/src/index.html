<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <head>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' data:;
    connect-src 'self' https://localhost:7084 https://localhost:3000 ws: wss:;
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
  ">
</head>
  <title>Chat Stream Client</title>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div class="container">
    <div class="chat-container">
      <div class="messages" id="messages"></div>

      <div class="input-container" style="position: relative;">
        <textarea id="messageInput" rows="1" placeholder="Enter your message..."></textarea>
        <button id="sendBtn">Send</button>
        <!-- Prompt file autocomplete dropdown -->
        <div id="promptDropdown" class="prompt-dropdown" style="display: none;"></div>
      </div>

      <div class="session-info">
        <span id="sessionIdDisplay">Sesja: Ładowanie...</span>
        <button id="newSessionBtn">Nowa sesja</button>
      </div>

      <div class="status" id="status">Ready</div>
    </div>
  </div>

  <script src="/main_window/index.js"></script>
</body>

</html>
