<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat Stream Client</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://localhost:7084 ws: wss:;">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background-color: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        padding: 20px;
      }
      
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      
      h1 {
        text-align: center;
        color: #4ecca3;
        margin-bottom: 30px;
      }
      
      .chat-container {
        background-color: #16213e;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      
      .messages {
        height: 400px;
        overflow-y: auto;
        border: 1px solid #0f3460;
        border-radius: 5px;
        padding: 15px;
        margin-bottom: 20px;
        background-color: #0f0f23;
      }
      
      .message {
        margin-bottom: 15px;
        padding: 10px 15px;
        border-radius: 8px;
        animation: fadeIn 0.3s ease-in;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .message.agent {
        background-color: #0f3460;
        border-left: 4px solid #4ecca3;
      }
      
      .message.system {
        background-color: #2d3561;
        color: #888;
        font-style: italic;
      }
      
      .input-container {
        display: flex;
        gap: 10px;
      }
      
      input[type="text"] {
        flex: 1;
        padding: 12px 15px;
        border: none;
        border-radius: 5px;
        background-color: #0f3460;
        color: #eee;
        font-size: 14px;
      }
      
      input[type="text"]:focus {
        outline: 2px solid #4ecca3;
      }
      
      button {
        padding: 12px 25px;
        background-color: #4ecca3;
        color: #1a1a2e;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      
      button:hover {
        background-color: #45b08c;
      }
      
      button:disabled {
        background-color: #666;
        cursor: not-allowed;
      }
      
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>💬 Chat Stream Client</h1>
      
      <div class="chat-container">
        <div class="messages" id="messages"></div>
        
        <div class="input-container">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Enter your message..."
          />
          <button id="sendBtn">Send</button>
        </div>
        
        <div class="status" id="status">Ready</div>
      </div>
    </div>
    
    <script src="/main_window/index.js"></script>
  </body>
</html>
